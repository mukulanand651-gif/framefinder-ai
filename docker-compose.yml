services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: product_brain
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/product_brain
      FRONTEND_ORIGIN: http://localhost:5173
      DEMO_MODE: "true"
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: ./backend
    command: npm run worker
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/product_brain
      DEMO_MODE: "true"
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  pgdata:
